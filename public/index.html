<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Notes</h1>
    </header>

    <main>
      <section class="panel">
        <h2 id="form-title">Create Note</h2>
        <form id="note-form">
          <label>
            Title
            <input id="title" name="title" type="text" required />
          </label>
          <label>
            Body
            <textarea id="body" name="body" rows="6"></textarea>
          </label>
          <div class="actions">
            <button type="submit" id="save-btn">Save</button>
            <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
            <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
          </div>
        </form>
        <p id="form-message" class="message" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="list-header">
          <h2>All Notes</h2>
          <input id="search" type="search" placeholder="Search titles…" />
        </div>
        <ul id="notes-list" class="notes"></ul>
      </section>
    </main>

    <template id="note-item">
      <li class="note-item">
        <button class="select" title="Edit"></button>
        <div class="meta">
          <h3 class="title"></h3>
          <p class="snippet"></p>
        </div>
      </li>
    </template>

    <script src="/main.js" type="module"></script>
  </body>
  </html>
