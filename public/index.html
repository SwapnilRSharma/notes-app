<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div class="max-w-3xl mx-auto p-6">
      <header class="flex items-center justify-between gap-4 mb-6">
        <h1 class="text-2xl font-semibold">Notes</h1>
        <button id="createBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700">Create a note</button>
      </header>

      <div class="mb-4">
        <input id="searchInput" type="search" placeholder="Search notes..." class="w-full px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <ul id="notesList" class="divide-y divide-gray-200 bg-white rounded-md shadow"></ul>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 hidden items-center justify-center">
      <div class="absolute inset-0 bg-black/40" data-close="modal"></div>
      <div class="relative bg-white w-full max-w-xl mx-4 rounded-lg shadow-lg">
        <div class="p-4 border-b flex items-center justify-between">
          <h2 id="modalTitle" class="text-lg font-medium">Note</h2>
          <button class="text-gray-500 hover:text-gray-700" data-close="modal">✕</button>
        </div>
        <div class="p-4 space-y-3" id="modalBody"></div>
        <div class="p-4 border-t flex items-center justify-end gap-2" id="modalActions"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
  </html>
